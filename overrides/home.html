{% extends "main.html" %}

<!-- Render hero under tabs -->
{% block tabs %}
  {{ super() }}
  
  <!-- Additional styles for landing page -->
<style>
  /* Application header should be static for the landing page */
  .md-header {
    position: initial;
  }
  
  /* Remove spacing, as we cannot hide it completely */
  .md-main__inner {
    margin: 0;
  }
  
  /* NUCLEAR OPTION - Force visibility at all levels */
  .md-content,
  .md-main .md-content,
  body .md-content,
  html .md-content {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    height: auto !important;
  }
  
  /* Hide only the inner markdown content */
  .md-content__inner {
    display: none !important;
  }
  
  /* Make sure spotlight is visible */
  .mdx-spotlight {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
  
  /* Hide table of contents */
  @media screen and (min-width: 60em) {
    .md-sidebar--secondary {
      display: none;
    }
  }
  
  /* Hide navigation */
  @media screen and (min-width: 76.25em) {
    .md-sidebar--primary {
      display: none;
    }
  }
</style>

  <!-- Hero for landing page -->
  <section class="mdx-container">
    <div class="md-grid md-typeset">
      <div class="mdx-hero">
        
        <!-- Hero image -->
        <div class="mdx-hero__image">
          <img
            src="assets/EarthDaily_Constellation_Hero.jpg"
            alt="EarthDaily Constellation"
            width="1659"
            height="1200"
            draggable="false"
          >
        </div>
        
        <!-- Hero content -->
        <div class="mdx-hero__content">
          <h1>{{ config.site_name }}</h1>
          <p>{{ config.site_description }}</p>
          <a
            href="https://earthdaily.com"
            title="Get Started"
            class="md-button md-button--primary"
            target="_blank"
            rel="noopener"
          >
            Get Started
          </a>
          <a
            href="https://earthdaily.com/contact"
            title="Contact us"
            class="md-button"
            target="_blank"
            rel="noopener"
          >
            Contact Us
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Feature Spotlight Section -->
  <section class="mdx-spotlight">
    <div class="md-grid">
      
      <!-- Feature 1: Satellite Imagery -->
      <figure class="mdx-spotlight__feature">
        <a href="agro/" tabindex="-1" title="Satellite Imagery">
          <img 
            src="./assets/earthdaily-agriculture-fields.jpg"
            alt="EarthDaily Agriculture" 
            loading="lazy" 
            width="500" 
            height="327"
          >
        </a>
        <figcaption class="md-typeset">
          <h2>Agriculture</h2>
          <p>
            Access <strong>ag analytics</strong> derived from EarthDaily's constellation 
            for precise crop monitoring and field-level analytics.
          </p>
          <p>
            Monitor vegetation health, track crop development, detect anomalies, predict yield with real time data.
          </p>
          <p>
            <a href="agro/" aria-label="EarthDaily Agriculture">
              <span class="twemoji">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M13.22 19.03a.75.75 0 0 1 0-1.06L18.19 13H3.75a.75.75 0 0 1 0-1.5h14.44l-4.97-4.97a.749.749 0 0 1 .326-1.275.75.75 0 0 1 .734.215l6.25 6.25a.75.75 0 0 1 0 1.06l-6.25 6.25a.75.75 0 0 1-1.06 0"></path>
                </svg>
              </span>
              Discover
            </a>
          </p>
        </figcaption>
      </figure>

      <!-- Feature 2: Data & Platform -->
      <figure class="mdx-spotlight__feature">
        <a href="data/" title="Data & Platform" tabindex="-1">
          <img
            src="./assets/earthdaily-data-aird.webp"
            alt="EarthDaily Data & Platform"
            loading="lazy"
            width="500"
            height="327"
          >
        </a>
        <figcaption class="md-typeset">
          <h2>Data & Platform</h2>
          <p>
            Access <strong>petabytes of geospatial data</strong> through our STAC-compliant
            APIs and scalable computing infrastructure. From Sentinel and Landsat imagery
            to <strong>AI-Ready Mosaics</strong> and analytics-ready collections.
          </p>
          <p>
            Explore data with EarthPlatform, run large-scale processing with EarthOne Compute,
            and build global models with <strong>high-throughput Catalog access</strong>.
          </p>
          <p>
            <a href="data/" aria-label="Data & Platform">
              <span class="twemoji">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M13.22 19.03a.75.75 0 0 1 0-1.06L18.19 13H3.75a.75.75 0 0 1 0-1.5h14.44l-4.97-4.97a.749.749 0 0 1 .326-1.275.75.75 0 0 1 .734.215l6.25 6.25a.75.75 0 0 1 0 1.06l-6.25 6.25a.75.75 0 0 1-1.06 0"></path>
                </svg>
              </span>
              Discover
            </a>
          </p>
        </figcaption>
      </figure>

      <!-- Feature 3: Mining & Energy -->
      <figure class="mdx-spotlight__feature">
        <a href="mining/" tabindex="-1" title="Mining & Energy">
          <img
            src="./assets/SpecTIR_PCA123_social.jpg"
            alt="EarthDaily Mining & Energy"
            loading="lazy"
            width="500"
            height="327"
          >
        </a>
        <figcaption class="md-typeset">
          <h2>Mining & Energy</h2>
          <p>
            Revolutionize mineral exploration with <strong>Marigold</strong>, our GIS platform
            for geological remote sensing. Access global Bare Earth Composites, run spectral
            analyses, and generate <strong>derived mapping products</strong>.
          </p>
          <p>
            Monitor infrastructure stability with <strong>Iris</strong>, our InSAR deformation
            platform delivering mm-scale ground movement detection and
            <strong>anomaly alerts</strong> within hours of satellite collection.
          </p>
          <p>
            <a href="mining/" aria-label="Mining & Energy">
              <span class="twemoji">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M13.22 19.03a.75.75 0 0 1 0-1.06L18.19 13H3.75a.75.75 0 0 1 0-1.5h14.44l-4.97-4.97a.749.749 0 0 1 .326-1.275.75.75 0 0 1 .734.215l6.25 6.25a.75.75 0 0 1 0 1.06l-6.25 6.25a.75.75 0 0 1-1.06 0"></path>
                </svg>
              </span>
              Discover
            </a>
          </p>
        </figcaption>
      </figure>

    </div>
  </section>
{% endblock %}

<!-- Content -->
{% block content %}{% endblock %}

<!-- Application footer -->
{% block footer %}{% endblock %}
