# Remember to have a requirements.txt file with the required dependencies.
#
# It is also recommendet to also copy the template with all branches, to
# have the gh-pages branch pre-made. This prevents possible errors.
#
name: Deploy documentation

on:
  push:
    paths: 
    - 'docs/**'
    - 'mkdocs.yml'
    - 'theme/**'
    branches:
    - master
    #
    # If your repository would have releases should you uncomment the below lines
    # in order to ignore pushes caused by newly created releases.
    #
    #tags-ignore:
    #- '**'
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install -r requirements.txt
    - name: Fetch private content
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
        bash scripts/fetch-private-content.sh
    - name: Deploy Files
      env:
        DOCS_CLASSIFIED_PASSWORD: ${{ secrets.DOCS_CLASSIFIED_PASSWORD }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        mkdocs gh-deploy --force
