plugins:
  - swagger-ui-tag:
      background: White
      docExpansion: none
      filter: ""
      syntaxHighlightTheme: monokai
  - meta
  - tags
  - search:
      lang:
        - en  
      separator: '[\s\-\.]+'
  - mkdocstrings:
      handlers:
        python:
          paths: []
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
  - encryptcontent:
      remember_keys: true
      session_storage: true
      default_expire_delay: 24
      decryption_failure_message: "Incorrect password. Please try again."
      password_inventory:
        classified: !ENV [DOCS_CLASSIFIED_PASSWORD, "changeme"]
